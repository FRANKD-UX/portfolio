<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">3CX and CRM contract boundaries</title><desc id="desc">Implementation account · logical contact/context exchange, not SIP signalling Components: Yealink / handset: Contact context; 3CX: Telephony platform; Integration contracts: API / XML mapping; Zoho / CRM: Customer context; Diagnostics: Interoperability; Private data boundary: Contacts omitted. Yealink / handset to 3CX: phonebook context; 3CX to Integration contracts: integration request; Integration contracts to Zoho / CRM: mapped contract; Integration contracts to Diagnostics: failure context</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">3CX and CRM contract boundaries</text><text x="30" y="82" class="sub">Implementation account · logical contact/context exchange, not SIP signalling</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">phonebook context</text><path d="M635,188 L700,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="114" text-anchor="middle" class="edge">integration request</text><path d="M835,246 C835,311 165,325 165,390" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="318" text-anchor="middle" class="edge">mapped contract</text><path d="M835,246 C835,311 500,32