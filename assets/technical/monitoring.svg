<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Zabbix monitoring and investigation</title><desc id="desc">CV-backed SNMP / iDRAC work · no measured SLO asserted Components: Physical servers: Dell iDRAC / SNMP; Zabbix: Signals / alerting; Operational response: Investigate failure; Linux / IIS: Service health; Application logs: Diagnostic context; Fault isolation: Host / service / app. Physical servers to Zabbix: hardware signals; Linux / IIS to Zabbix: service signals; Zabbix to Operational response: alert context; Application logs to Fault isolation: correlate; Operational response to Fault isolation: investigate</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">Zabbix monitoring and investigation</text><text x="30" y="82" class="sub">CV-backed SNMP / iDRAC work · no measured SLO asserted</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">hardware signals</text><path d="M165,390 C165,325 500,311 500,246" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="318" text-anchor="middle" class="edge">service signals</text><path d="M635,188 L700,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="114" text-anchor="middle" class="edge">alert context</text><path d="M635,448 L700,448" fill="non