<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Workspace identity and authorization</title><desc id="desc">Implementation account · wider platform and personal contribution distinguished Components: Angular: Requests / PMO views; ASP.NET Core 8: Resource authorization; Microsoft Entra ID: Authentication; Department + groups: Access boundaries; SQL Server / EF Core: Work / reference data; PMO / work services: Ownership / approval. Angular to ASP.NET Core 8: API request; Microsoft Entra ID to ASP.NET Core 8: identity; ASP.NET Core 8 to Department + groups: check authority; ASP.NET Core 8 to SQL Server / EF Core: persistence; ASP.NET Core 8 to PMO / work services: permitted action</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">Workspace identity and authorization</text><text x="30" y="82" class="sub">Implementation account · wider platform and personal contribution distinguished</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">API request</text><path d="M700,188 L635,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="114" text-anchor="middle" class="edge">identity</text><path d="M500,246 C500,311 165,325 165,390" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="318" text-anchor