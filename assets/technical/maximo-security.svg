<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Maximo static website architecture</title><desc id="desc">Inspected source · enquiry creates a local file, not a backend submission Components: HTML pages: Services / contact; Shared CSS + JS: Navigation / dialogs; GitHub Pages: Static hosting; Enquiry form: Review request text; Browser Blob: Local text download; Submission API: Not implemented. GitHub Pages to HTML pages: serve files; HTML pages to Shared CSS + JS: shared behaviour; Enquiry form to Browser Blob: local export</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">Maximo static website architecture</text><text x="30" y="82" class="sub">Inspected source · enquiry creates a local file, not a backend submission</text><path d="M700,188 L300,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="114" text-anchor="middle" class="edge">serve files</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">shared behaviour</text><path d="M300,448 L365,448" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="374" text-anchor="middle" class="edge">local export</text><rect x="30" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="165" y="168" text-anchor="middle" class="node">HTML pages</text><text x="165" y="226" text-anchor="middle" class="detail">Services / contact</text><rect x="365" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="500" y="168" text-anchor="middle" class="node">Shared CSS + JS</text><text x="500" y="226" text-anchor="middle" class="detail">Navigation / dialogs</text><rect x="700" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="835" y="168" text-anchor="middle" class="node">GitHub Pages</text><text x="835" y="226" text-anchor="middle" class="detail">Static hosting</text><rect x="30" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="165" y="428" text-anchor="middle" class="node">Enquiry form</text><text x="165" y="486" text-anchor="middle" class="detail">Review request text</text><rect x="365" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="500" y="428" text-anchor="middle" class="node">Browser Blob</text><text x="500" y="486" text-anchor="middle" class="detail">Local text download</text><rect x="700" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="835" y="428" text-anchor="middle" class="node">Submission API</text><text x="835" y="486" text-anchor="middle" class="detail">Not implemented</text><text x="30" y="566" class="sub">Logical data / control flow · sanitized for the public portfolio</text></svg>
