<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Departmental workflow transitions</title><desc id="desc">Implementation account · representative flow, not an exhaustive enum graph Components: Support Border Control: Intake / route; Accounts / Operations: Accept work; Checklist + completion: Backend validation; Recall / correction: Resubmit for checks; Return to Support: Final validation; Eligible closure: Zoho remains separate. Support Border Control to Accounts / Operations: handoff; Accounts / Operations to Checklist + completion: complete request; Checklist + completion to Return to Support: return; Return to Support to Eligible closure: eligible; Checklist + completion to Recall / correction: correction path; Recall / correction to Accounts / Operations: resubmission</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">Departmental workflow transitions</text><text x="30" y="82" class="sub">Implementation account · representative flow, not an exhaustive enum graph</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">handoff</text><path d="M635,188 L700,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="114" text-anchor="middle" class="edge">complete request</text><path d="M835,246 C835,311 500,325 500,390" fill="none" strok