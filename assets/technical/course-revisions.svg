<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Course revision and learning persistence</title><desc id="desc">Source-backed · clone content; retain learner evidence Components: Logical course family: Canonical public slug; Revision 1: Retained curriculum IDs; Revision 2: Independent content IDs; Existing enrolment: Original progress / attempts; Current publication: New enrolments; Instructor roster: Selected revision / owner. Logical course family to Revision 1: original revision; Logical course family to Revision 2: new publication; Revision 1 to Existing enrolment: retain linkage; Revision 2 to Current publication: resolve current; Existing enrolment to Instructor roster: history projection</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">Course revision and learning persistence</text><text x="30" y="82" class="sub">Source-backed · clone content; retain learner evidence</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">original revision</text><path d="M300,188 L700,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="114" text-anchor="middle" class="edge">new publication</text><path d="M500,246 C500,311 165,325 165,390" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="318" text-