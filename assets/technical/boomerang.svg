<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Boomerang integration architecture</title><desc id="desc">Implementation account · sanitized logical boundaries Components: Angular: Department participants; IntegrationGateway.Api: Application services; Zoho Desk: Customer-facing tickets; SQL Server / EF Core: Internal workflow state; Workflow validation: Department + checklist; Incident context: Linkage / audit / SLA. Angular to IntegrationGateway.Api: action request; IntegrationGateway.Api to Zoho Desk: external API; IntegrationGateway.Api to SQL Server / EF Core: persistence; IntegrationGateway.Api to Workflow validation: validate; Workflow validation to Incident context: permitted work</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">Boomerang integration architecture</text><text x="30" y="82" class="sub">Implementation account · sanitized logical boundaries</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">action request</text><path d="M635,188 L700,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="114" text-anchor="middle" class="edge">external API</text><path d="M500,246 C500,311 165,325 165,390" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="318" text-anchor="middle" class="edge">persistence</text><path d="M500,246 C500,311 500,325 500,390" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="318" text-anchor="middle" class="edge">validate</text><path d="M635,448 L700,448" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="374" text-anchor="middle" class="edge">permitted work</text><rect x="30" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="165" y="168" text-anchor="middle" class="node">Angular</text><text x="165" y="226" text-anchor="middle" class="detail">Department participants</text><rect x="365" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="500" y="168" text-anchor="middle" class="node">IntegrationGateway.Api</text><text x="500" y="226" text-anchor="middle" class="detail">Application services</text><rect x="700" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="835" y="168" text-anchor="middle" class="node">Zoho Desk</text><text x="835" y="226" text-anchor="middle" class="detail">Customer-facing tickets</text><rect x="30" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="165" y="428" text-anchor="middle" class="node">SQL Server / EF Core</text><text x="165" y="486" text-anchor="middle" class="detail">Internal workflow state</text><rect x="365" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="500" y="428" text-anchor="middle" class="node">Workflow validation</text><text x="500" y="486" text-anchor="middle" class="detail">Department + checklist</text><rect x="700" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="835" y="428" text-anchor="middle" class="node">Incident context</text><text x="835" y="486" text-anchor="middle" class="detail">Linkage / audit / SLA</text><text x="30" y="566" class="sub">Logical data / control flow · sanitized for the public port