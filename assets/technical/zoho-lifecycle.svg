<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Zoho ticket and internal incident lifecycle</title><desc id="desc">Distinct state models · no automatic equivalence or closure implied Components: Customer ticket: Zoho status / department; Update webhook: Native external payload; Correlate incident: Persistent external ID; Boomerang workflow: Internal handoff state; Support validation: Closure eligibility; Zoho ticket update: Separate external action. Customer ticket to Update webhook: ticket event; Update webhook to Correlate incident: normalize; Correlate incident to Boomerang workflow: synchronize context; Boomerang workflow to Support validation: return to Support; Support validation to Zoho ticket update: eligible update</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">Zoho ticket and internal incident lifecycle</text><text x="30" y="82" class="sub">Distinct state models · no automatic equivalence or closure implied</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">ticket event</text><path d="M635,188 L700,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="114" text-anchor="middle" class="edge">normalize</text><path d="M835,246 C835,311 165,325 165,390" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="318" text-anchor="middle" class="edge">synchronize context</text><path d="M300,448 L365,448" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="374" text-anchor="middle" class="edge">return to Support</text><path d="M635,448 L700,448" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="374" text-anchor="middle" class="edge">eligible update</text><rect x="30" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="165" y="168" text-anchor="middle" class="node">Customer ticket</text><text x="165" y="226" text-anchor="middle" class="detail">Zoho status / department</text><rect x="365" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="500" y="168" text-anchor="middle" class="node">Update webhook</text><text x="500" y="226" text-anchor="middle" class="detail">Native external payload</text><rect x="700" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="835" y="168" text-anchor="middle" class="node">Correlate incident</text><text x="835" y="226" text-anchor="middle" class="detail">Persistent external ID</text><rect x="30" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="165" y="428" text-anchor="middle" class="node">Boomerang workflow</text><text x="165" y="486" text-anchor="middle" class="detail">Internal handoff state</text><rect x="365" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="500" y="428" text-anchor="middle" class="node">Support validation</text><text x="500" y="486" text-anchor="middle" class="detail">Closure eligibility</text><rect x="700" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="835" y="428" text-anchor="middle" class="node">Zoho ticket update</text><text x="835" y="486" text-anchor="middle" class="detail">Separate external action</text><text x="30" y="566" clas