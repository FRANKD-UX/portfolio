<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">FrankAcademy application architecture</title><desc id="desc">Source-backed · original ASP.NET Core 8; later merged .NET 10 migration Components: Next.js: Server Actions / UI; ASP.NET API: Identity + handlers; PostgreSQL / EF Core: Business persistence; OpenAPI: Typed HTTP contract; Learning records: Enrolment / progress; Azure DevOps: Build / relational / E2E. Next.js to ASP.NET API: typed HTTP; ASP.NET API to PostgreSQL / EF Core: authoritative writes; OpenAPI to Next.js: generated types; PostgreSQL / EF Core to Learning records: stored evidence; Azure DevOps to ASP.NET API: validation</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81918e"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#f1f0ed}.node{font-size:21px;font-weight:600}.detail,.edge{font-size:18px;fill:#c0c6c9}.edge{paint-order:stroke;stroke:#20242b;stroke-width:7;stroke-linejoin:round}.heading{font-size:29px;font-weight:600}.sub{font-size:18px;fill:#c0c6c9}</style><rect width="100%" height="100%" rx="8" fill="#20242b"/><text x="30" y="45" class="heading">FrankAcademy application architecture</text><text x="30" y="82" class="sub">Source-backed · original ASP.NET Core 8; later merged .NET 10 migration</text><path d="M300,188 L365,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="332.5" y="114" text-anchor="middle" class="edge">typed HTTP</text><path d="M635,188 L700,188" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="114" text-anchor="middle" class="edge">authoritative writes</text><path d="M165,390 C165,325 165,311 165,246" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="165" y="318" text-anchor="middle" class="edge">generated types</text><path d="M835,246 C835,311 500,325 500,390" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="318" text-anchor="middle" class="edge">stored evidence</text><path d="M835,390 C835,325 500,311 500,246" fill="none" stroke="#81918e" stroke-width="2" marker-end="url(#arrow)"/><text x="667.5" y="318" text-anchor="middle" class="edge">validation</text><rect x="30" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="165" y="168" text-anchor="middle" class="node">Next.js</text><text x="165" y="226" text-anchor="middle" class="detail">Server Actions / UI</text><rect x="365" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="500" y="168" text-anchor="middle" class="node">ASP.NET API</text><text x="500" y="226" text-anchor="middle" class="detail">Identity + handlers</text><rect x="700" y="130" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="835" y="168" text-anchor="middle" class="node">PostgreSQL / EF Core</text><text x="835" y="226" text-anchor="middle" class="detail">Business persistence</text><rect x="30" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="165" y="428" text-anchor="middle" class="node">OpenAPI</text><text x="165" y="486" text-anchor="middle" class="detail">Typed HTTP contract</text><rect x="365" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="500" y="428" text-anchor="middle" class="node">Learning records</text><text x="500" y="486" text-anchor="middle" class="detail">Enrolment / progress</text><rect x="700" y="390" width="270" height="116" rx="8" fill="#2b3038" stroke="#81918e"/><text x="835" y="428" text-anchor="middle" class="node">Azure DevOps</text><text x="835" y="486" text-anchor="middle" class="detail">Build / relational / E2E</text><text x="30" y="566" class="sub">Logical data / control flow · sanitized for the public portfolio</text></svg>
